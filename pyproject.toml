[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marjapussi"
version = "1.1.1"
description = "Python Implementation of Marjapussi."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [{ name = "Samuel Leßmann", email = "samuel@lessmann.dev" }]
dependencies = ["pydantic>=2.0"]

[project.urls]
Repository = "https://github.com/SamuelLess/marjapussi"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"marjapussi/legacy/game.py" = ["ALL"]
"marjapussi/legacy/player.py" = ["ALL"]
"marjapussi/legacy/utils.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
