[workspace]
name = "marjapussi"
version = "1.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.12"
lefthook = ">=2.1.1,<3"
typos = ">=1.43.4,<2"
pre-commit-hooks = ">=5.0.0,<6"

[pypi-dependencies]
marjapussi = { path = ".", editable = true }

[feature.dev.pypi-dependencies]
pytest = "*"
ruff = "*"

[feature.dev.tasks]
test = "pytest tests/ -v"
lefthook-install = "lefthook install"
lefthook-run = "lefthook run pre-commit --all-files"

[environments]
default = { features = ["dev"], solve-group = "default" }
